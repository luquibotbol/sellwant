name: Deploy

# Every push to main goes live. Nothing else deploys -- branches and PRs run
# the checks only, so you can push work in progress without shipping it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two runs racing would both `wrangler deploy`, and the
# slower one could publish an older build over a newer one. cancel-in-progress
# stays false: killing a deploy midway is worse than queueing behind it.
concurrency:
  # PR runs never deploy, so they get their own group. Sharing deploy-main let
  # a newly opened PR replace a queued push-to-main run, and that commit then
  # never shipped until the next push.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-main' }}
  cancel-in-progress: false

# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: sellwant

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # PR checks must not mutate the production marketplace. The existing
      # database suite remains available for an explicitly isolated project.
      - name: Offline tests
        run: bun run test:offline

      - name: Ticket normalization and PNG decoding
        run: |
          bun scripts/test-normalise.ts
          bun scripts/make-test-qrs.ts
          bun scripts/test-decode.ts

  deploy:
    name: Deploy to Cloudflare
    needs: check
    # Everything except a PR deploys. The push trigger is already
    # restricted to main, and the manual "Run workflow" button should
    # actually ship -- guarding on event_name == 'push' silently turned
    # every manual run into a checks-only run.
    # Production only ever ships main. A manual run on any other branch used to
    # deploy that branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      # expo export inlines every EXPO_PUBLIC_* var into the bundle at build
      # time. Without them here the deployed app ships with no Supabase config
      # and every screen fails at runtime -- with no build error to warn you.
      - name: Build web bundle
        run: bun run build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # Fail loudly rather than deploying a bundle that cannot reach Supabase.
      - name: Verify the bundle carries its config
        run: |
          if ! grep -rq "supabase.co" dist/_expo/static/js/web/*.js; then
            echo "::error::Built bundle has no Supabase URL — EXPO_PUBLIC_* secrets are missing or empty."
            exit 1
          fi
          echo "Supabase config present in bundle."

      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test the live site
        run: |
          for path in "" feed offers deal/smoke-test u/smoke-test; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
              "https://sellwant.com/$path")
            echo "  /$path -> $code"
            [ "$code" = "200" ] || { echo "::error::/$path returned $code"; exit 1; }
          done
